apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: open-data-app
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/AndrianTN/open-data-ai-analytics.git
    targetRevision: main
    path: gitops/app

  destination:
    server: https://kubernetes.default.svc
    namespace: open-data

  syncPolicy:
    automated:
      prune: true
      selfHeal: true