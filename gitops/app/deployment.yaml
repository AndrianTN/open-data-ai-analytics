apiVersion: apps/v1
kind: Deployment
metadata:
  name: open-data-app
  namespace: open-data
spec:
  replicas: 1
  selector:
    matchLabels:
      app: open-data-app
  template:
    metadata:
      labels:
        app: open-data-app
    spec:
      containers:
      - name: open-data-app
        image: ghcr.io/andriantn/open-data-ai-analytics:latest
        ports:
        - containerPort: 5000